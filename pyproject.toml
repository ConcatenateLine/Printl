[project]
name = "printl"
version = "1.0.0"
description = "Printl is a desktop application for managing printers and exposing them as a service."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Concatenate Line", email = "concatenateline@gmail.com" }
]
dependencies = [
  "flet==0.27.6"
]

[tool.flet]
# org name in reverse domain name notation, e.g. "com.concatenateline".
# Combined with project.name to build bundle ID for iOS and Android apps
org = "com.concatenateline"

# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
product = "printl"

# company name to display in about app dialogs
company = "Concatenate Line"

# copyright text to display in about app dialogs
copyright = "Copyright (C) 2025 by Flet"

[tool.flet.app]
path = "src"

[tool.uv]
dev-dependencies = [
    "flet[all]==0.27.6",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flet = {extras = ["all"], version = "0.27.6"}